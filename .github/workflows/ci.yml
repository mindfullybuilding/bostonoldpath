name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check generated pages and internal links
        run: |
          node scripts/preview.mjs > "$RUNNER_TEMP/site-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ > /dev/null; then
            cat "$RUNNER_TEMP/site-preview.log"
            exit 1
          fi
          npm run test:links
      - name: Check the Plumline preview with sample data
        run: |
          npm run build:plumline-preview
          MCGB_PREVIEW_PORT=4175 node scripts/preview.mjs > "$RUNNER_TEMP/plumline-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4175/ > /dev/null; then
            cat "$RUNNER_TEMP/plumline-preview.log"
            exit 1
          fi
          TEST_BASE=http://127.0.0.1:4175 node tests/plumline-finder-browser.mjs
