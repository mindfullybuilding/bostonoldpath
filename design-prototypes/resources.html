<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resources | Boston Old Path Sangha</title>
    <style>
      :root {
        color-scheme: light;
        --sun: #ffd22a;
        --light-sun: #fefbf3;
        --ink: #222;
        --dark-ink: #272727;
        --earth: #8b572a;
        --cloud: #fff;
        --less-light-ink: #eaeaea;
        --muted: #6d6a62;
        --focus: #8b572a;
        --radius: 8px;
        --shadow: 0 18px 60px rgba(34, 34, 34, 0.08);
        --font-sans: "PV Sans Serif", ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--light-sun);
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--light-sun);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.5;
      }

      a {
        color: inherit;
      }

      a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      .page {
        min-height: 100vh;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--less-light-ink);
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(12px);
      }

      .topbar-inner,
      .content {
        width: min(1160px, calc(100% - 32px));
        margin: 0 auto;
      }

      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 0;
      }

      .brand {
        display: grid;
        gap: 1px;
      }

      .brand strong {
        font-size: 1rem;
      }

      .brand span,
      .path-label {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .path-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        border: 1px solid rgba(139, 87, 42, 0.14);
        border-radius: 999px;
        padding: 6px 10px 6px 12px;
        background: rgba(255, 210, 42, 0.16);
      }

      .text-button {
        border-bottom: 2px solid var(--sun);
        padding: 2px 0;
        color: var(--ink);
        font-weight: 700;
        text-decoration: none;
      }

      .content {
        display: flex;
        min-height: calc(100vh - 73px);
        flex-direction: column;
        padding: clamp(28px, 4vw, 44px) 0 52px;
      }

      .context-nav {
        margin-bottom: 14px;
      }

      .context-nav .text-button {
        font-size: 0.88rem;
      }

      .resource-shell {
        border: 1px solid var(--less-light-ink);
        border-radius: var(--radius);
        background: var(--cloud);
      }

      .resource-header {
        display: grid;
        gap: 8px;
        border-bottom: 1px solid var(--less-light-ink);
        padding: clamp(18px, 3vw, 28px);
      }

      .eyebrow {
        margin: 0;
        color: var(--earth);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      h1 {
        margin-bottom: 0;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .lede {
        max-width: 720px;
        margin-bottom: 0;
        color: var(--muted);
      }

      .resource-grid {
        display: grid;
        gap: 12px;
        padding: clamp(18px, 3vw, 28px);
      }

      .resource-card {
        display: grid;
        min-height: 154px;
        align-content: space-between;
        gap: 18px;
        border: 1px solid var(--less-light-ink);
        border-radius: var(--radius);
        padding: 18px;
        background: var(--cloud);
        color: inherit;
        text-decoration: none;
        transition:
          border-color 160ms ease,
          background-color 160ms ease,
          transform 160ms ease;
      }

      .resource-card:hover {
        border-color: var(--earth);
        background: var(--light-sun);
        transform: translateY(-2px);
      }

      .resource-card h2 {
        margin-bottom: 6px;
        font-size: 1.05rem;
      }

      .resource-card p {
        margin-bottom: 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .footer-note {
        margin-top: auto;
        padding-top: 34px;
        color: var(--muted);
        font-size: 0.88rem;
        text-align: center;
      }

      .footer-note a {
        text-decoration: none;
      }

      .footer-note a:hover {
        color: var(--ink);
        text-decoration: underline;
      }

      @media (min-width: 660px) {
        .resource-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (min-width: 980px) {
        .resource-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 620px) {
        .topbar-inner {
          align-items: flex-start;
        }

        .brand span {
          display: none;
        }

        .path-tools {
          border-radius: var(--radius);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .resource-card {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand" aria-label="BOPS homepage">
            <strong>Boston Old Path Sangha</strong>
            <span>Mindfulness in Boston and everywhere...</span>
          </div>
          <div class="path-tools">
            <span class="path-label">Beginner's Mind</span>
            <a class="text-button" href="bops-homepage-wireframe-6.15.26.html?reset=1">
              Change path
            </a>
          </div>
        </div>
      </header>

      <main class="content">
        <nav class="context-nav" aria-label="Section navigation">
          <a class="text-button" href="bops-homepage-wireframe-6.15.26.html?path=beginner&section=learn-belong">
            Back to Learn
          </a>
        </nav>

        <section class="resource-shell" aria-labelledby="resources-title">
          <header class="resource-header">
            <p class="eyebrow">Learn / Resources</p>
            <h1 id="resources-title">Practice resources</h1>
            <p class="lede">
              Talks, readings, teachers, and community links for learning between
              sittings.
            </p>
          </header>
          <div class="resource-grid" id="resource-grid"></div>
        </section>

        <p class="footer-note">
          <a href="#">Terms and Conditions</a> |
          <a href="#">Privacy Policy</a> |
          <a href="#">Press &amp; Media</a> |
          <a href="#">Contact Us</a>
        </p>
      </main>
    </div>

    <script>
      const resources = [
        {
          title: "Thich Nhat Hanh",
          copy: "Learn about Thich Nhat Hanh (Thay), his teachings, and the Plum Village tradition.",
          url: "https://plumvillage.org/about/thich-nhat-hanh",
        },
        {
          title: "Plum Village",
          copy: "Learn about the Plum Village tradition, practice centers, and global community.",
          url: "https://plumvillage.org/about/plum-village",
        },
        {
          title: "Join Plumline mailing list",
          copy: "Receive broader Plumline updates for sangha discovery and community-building resources.",
          url: "https://www.plumline.org/building",
        },
        {
          title: "The Way Out Is In Podcast",
          copy: "Listen to conversations on mindfulness, engaged practice, and daily life in the Plum Village tradition.",
          url: "https://plumvillage.org/podcasts/the-way-out-is-in",
        },
        {
          title: "Key Books",
          copy: "Browse foundational books from Thich Nhat Hanh for study, reflection, and practice.",
          url: "https://plumvillage.org/about/thich-nhat-hanh/key-books",
        },
        {
          title: "Letters from Thich Nhat Hanh",
          copy: "Read letters and teachings from Thay for personal practice and community reflection.",
          url: "https://plumvillage.org/about/thich-nhat-hanh/letters",
        },
        {
          title: "Joanna Macy",
          copy: "Explore resources on engaged ecological practice, grief, resilience, and the work that reconnects.",
          url: "https://www.joannamacy.net/main",
        },
        {
          title: "Pema Chodron",
          copy: "Find teachings and resources on compassion, courage, and working with difficulty.",
          url: "https://pemachodronfoundation.org/",
        },
        {
          title: "Jack Kornfield",
          copy: "Explore talks, writings, and practice resources from a Western insight meditation teacher.",
          url: "https://jackkornfield.com/",
        },
        {
          title: "Bhante Gunaratana",
          copy: "Browse teachings and books from a Theravada monk known for practical mindfulness instruction.",
          url: "https://wisdomexperience.org/content-author/bhante-gunaratana/",
        },
        {
          title: "New England Buddhist Poetry Exchange",
          copy: "Read community poetry, reflections, and Buddhist practice writing from New England community members.",
          url: "https://buddhistpoetryexchange.blogspot.com",
        },
      ];

      document.querySelector("#resource-grid").innerHTML = resources
        .map(
          (resource) => `
            <a
              class="resource-card"
              href="${resource.url}"
              target="_blank"
              rel="noopener noreferrer"
            >
              <div>
                <h2>${resource.title}</h2>
                <p>${resource.copy}</p>
              </div>
            </a>
          `,
        )
        .join("");
    </script>
  </body>
</html>
